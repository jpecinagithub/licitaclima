# LicitaClima web — nginx del contenedor.
# La web es una SPA (React Router) con 10 rutas públicas prerenderadas a
# HTML estático. Sin fallback, cualquier ruta no prerenderada (/acceso,
# /app/*, /admin/*) devolvía 404 del nginx al cargarla directamente o al
# refrescar — incluido /acceso/confirmar, donde aterriza el magic link.
# Con try_files, las rutas prerenderadas siguen sirviendo su HTML estático
# y el resto cae en /index.html, donde el router muestra la página o el
# NotFoundPage de la app.
server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
